name: Diametric Capital
description: >-
  Diametric Capital is an equity long/short, multi-manager investment fund firm
  headquartered in Boston and New York. The firm builds customizable funds that
  isolate what it calls "True Alpha" — returns uncorrelated to the broader market
  — by removing beta and factor risk exposure to deliver performance with
  below-average volatility. Alongside its funds it offers aligned fee structures,
  capital partnerships, and business development support to entrepreneurs and
  emerging managers. Diametric Capital is a private financial firm and does not
  publish a public developer program, API, or SDK surface; it operates a secure
  client data room for investors and partners.
